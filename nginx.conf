server {
    listen 80;
    listen [::]:80;
    server_name careervault.prasadsawant.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name careervault.prasadsawant.com;
    
    # Frontend output created by `npm run build`.
    root /var/www/CareerVault/Dev/frontend/dist/spa;
    index index.html;

    # API, Swagger, ReDoc, and OpenAPI are all backend endpoints.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All non-API requests are handled by the frontend single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
